services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patient_monitoring
      POSTGRES_USER: patient
      POSTGRES_PASSWORD: patient
    ports:
      - "5432:5432"
    volumes:
      - patient-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient -d patient_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://patient:patient@db:5432/patient_monitoring?sslmode=disable
      APP_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  patient-postgres-data:
